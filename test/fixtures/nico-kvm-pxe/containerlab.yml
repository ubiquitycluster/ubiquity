name: nico-kvm-pxe
prefix: ubiquity

# Fixture for docs/test/e2e/nico-kvm-pxe-lab.sh.
# This is intentionally a template because the qemu-bmc image/tag, host bridge,
# disk image, and VM networking vary by lab host.
# Replace [REDACTED] values locally; do not commit real credentials or tokens.

topology:
  nodes:
    qemu-node-01:
      kind: linux
      image: ghcr.io/tjst-t/qemu-bmc:latest
      privileged: true
      env:
        IPMI_USER: admin
        IPMI_PASS: "[REDACTED]"
        POWER_ON_AT_START: "false"
        VM_MEMORY: "4096"
        VM_CPUS: "2"
        VM_BOOT: "n"
        VM_BOOT_MODE: bios
        ENABLE_KVM: "true"
        # VM_NETWORKS should be set to the provisioning bridge/TAP interface on
        # the lab host or generated by the containerlab/qemu-bmc setup.
        VM_NETWORKS: "[REDACTED]"
      binds:
        # Provide an ignored local qcow2 disk for the VM.
        - ./local/qemu-node-01.qcow2:/vm/disk.qcow2
      ports:
        # Redfish/noVNC HTTPS endpoint and IPMI UDP are exposed for lab debugging.
        - 8443:443
        - 8623:623/udp
