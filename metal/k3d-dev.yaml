# Provision cluster - Sandbox

apiVersion: k3d.io/v1alpha4
kind: Simple
metadata:
  name: ubiquity-dev
# Image is overridden at runtime by runSandbox() via --image flag.
# The default version is read from metal/k3s-default-version.txt.
# Override permanently by setting K3S_IMAGE env var before ubiquity up.
image: rancher/k3s:v1.32.13-k3s1  # fallback, overridden by --image
servers: 1
agents: 1
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      - arg: --disable-cloud-controller
        nodeFilters:
          - server:*
            #      - arg: --resolv-conf=1.1.1.1
            #        nodeFilters:
            #          - server:*
ports:
  - port: 80:80
    nodeFilters:
      - loadbalancer
  - port: 443:443
    nodeFilters:
      - loadbalancer
