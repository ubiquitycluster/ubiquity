name: Dependency Freshness

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

jobs:
  dependency-freshness:
    name: Scheduled dependency freshness report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23"

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: "v3.16"

      - name: Generate dependency freshness report
        run: test/e2e/dependency-freshness-report.sh --dry-run

      - name: Upload dependency freshness report
        uses: actions/upload-artifact@v7
        with:
          name: dependency-freshness-report
          path: /tmp/ubiquity-security/dependency-freshness-report.md
