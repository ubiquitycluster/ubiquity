---
# Placeholder-safe ArgoCD cluster secret template.
# Do not commit rendered bearer tokens, kubeconfigs, CA data, NetBird setup keys,
# or NetBird PATs. Use SOPS, External Secrets, Sealed Secrets, or a cloud secret
# manager to materialize real values at deploy time.
apiVersion: v1
kind: Secret
metadata:
  name: spanish-fork-gpu-01
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    ubiquity.io/region: us-west
    ubiquity.io/site: spanish-fork
    ubiquity.io/trust-tier: production
    ubiquity.io/gpu: "true"
    ubiquity.io/gpu-class: h100
    ubiquity.io/rdma: "true"
    ubiquity.io/inference: "true"
    ubiquity.io/storage: vast
  annotations:
    ubiquity.io/netbird-resource: regional-kube-api
    ubiquity.io/readiness-gate: collect-readiness-and-ai-health
    ubiquity.io/credential-source: external-secret-manager
    ubiquity.io/secret-template-only: "true"
type: Opaque
stringData:
  name: spanish-fork-gpu-01
  server: https://NETBIRD_OVERLAY_IP_OR_DNS:6443
  config: |
    {
      "bearerToken": "PLACEHOLDER_BEARER_TOKEN_FROM_REMOTE_CLUSTER_SERVICE_ACCOUNT",
      "tlsClientConfig": {
        "caData": "PLACEHOLDER_BASE64_CLUSTER_CA_FROM_REMOTE_CLUSTER",
        "insecure": false
      }
    }
