# Default values for kyverno-policies.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Enable or disable all policies in this chart
enabled: true

policies:
  restrictedPodSecurity:
    # -- Enable the restricted Pod Security Standards policy
    enabled: true
    # -- Namespaces exempt from this policy (e.g. system-critical namespaces managed by ArgoCD)
    exemptNamespaces:
      - kube-system
      - kyverno
      - argocd
    # -- Exempt resources matching these labels
    exemptLabels:
      app.kubernetes.io/managed-by: argocd

  disallowPrivilegedContainers:
    # -- Enable the disallow privileged containers policy
    enabled: true

  requireLabels:
    # -- Enable the require labels policy
    enabled: true
    # -- Required labels that must be present on all resources
    requiredLabels:
      - app.kubernetes.io/name

  defaultNetworkPolicyDenies:
    # -- Enable the default-deny NetworkPolicy policy
    enabled: true
    # -- Namespaces exempt from this policy
    exemptNamespaces:
      - kube-system
      - kyverno