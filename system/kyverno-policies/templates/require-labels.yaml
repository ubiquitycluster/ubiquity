{{- if .Values.policies.requireLabels.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
  annotations:
    policies.kyverno.io/title: Require Labels
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Requires the app.kubernetes.io/name label on all resources.
spec:
  validationFailureAction: {{ .Values.policies.requireLabels.validationFailureAction | default "Enforce" }}
  background: true
  rules:
    - name: require-app-name-label
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - StatefulSet
                - DaemonSet
                - ReplicaSet
                - Service
                - Ingress
                - ConfigMap
                - Secret
                - PersistentVolumeClaim
                - ServiceAccount
      exclude:
        any:
          - resources:
              namespaces:
                {{- range .Values.policies.requireLabels.exemptNamespaces }}
                - {{ . }}
                {{- end }}
          - resources:
              selector:
                matchLabels:
                  {{- range $key, $value := .Values.policies.requireLabels.exemptLabels }}
                  {{ $key }}: {{ $value }}
                  {{- end }}
      validate:
        message: "The label 'app.kubernetes.io/name' is required for all resources."
        pattern:
          metadata:
            labels:
              app.kubernetes.io/name: "?*"
{{- end }}