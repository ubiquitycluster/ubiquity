{{- if .Values.policies.disallowPrivilegedContainers.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod,Container
    policies.kyverno.io/description: >-
      Forbids privileged containers and privilege escalation.
      Only allows the default set of capabilities.
spec:
  validationFailureAction: {{ .Values.policies.disallowPrivilegedContainers.validationFailureAction | default "Enforce" }}
  background: true
  rules:
    - name: forbid-privileged
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                {{- range .Values.policies.disallowPrivilegedContainers.exemptNamespaces }}
                - {{ . }}
                {{- end }}
          - resources:
              selector:
                matchLabels:
                  {{- range $key, $value := .Values.policies.disallowPrivilegedContainers.exemptLabels }}
                  {{ $key }}: {{ $value }}
                  {{- end }}
      validate:
        message: "Privileged containers are not allowed. Set securityContext.privileged: false."
        pattern:
          spec:
            containers:
              - securityContext:
                  privileged: false
            =(ephemeralContainers):
              - securityContext:
                  privileged: false
            =(initContainers):
              - securityContext:
                  privileged: false
    - name: forbid-privilege-escalation
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                {{- range .Values.policies.disallowPrivilegedContainers.exemptNamespaces }}
                - {{ . }}
                {{- end }}
          - resources:
              selector:
                matchLabels:
                  {{- range $key, $value := .Values.policies.disallowPrivilegedContainers.exemptLabels }}
                  {{ $key }}: {{ $value }}
                  {{- end }}
      validate:
        message: "Privilege escalation is not allowed. Set securityContext.allowPrivilegeEscalation: false."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
            =(ephemeralContainers):
              - securityContext:
                  allowPrivilegeEscalation: false
            =(initContainers):
              - securityContext:
                  allowPrivilegeEscalation: false
    - name: restrict-capabilities
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                {{- range .Values.policies.disallowPrivilegedContainers.exemptNamespaces }}
                - {{ . }}
                {{- end }}
          - resources:
              selector:
                matchLabels:
                  {{- range $key, $value := .Values.policies.disallowPrivilegedContainers.exemptLabels }}
                  {{ $key }}: {{ $value }}
                  {{- end }}
      validate:
        message: >-
          Only the default container capabilities are allowed.
          Do not add additional capabilities via capabilities.add.
        pattern:
          spec:
            containers:
              - =(securityContext):
                  =(capabilities):
                    =(add): []
            =(ephemeralContainers):
              - =(securityContext):
                  =(capabilities):
                    =(add): []
            =(initContainers):
              - =(securityContext):
                  =(capabilities):
                    =(add): []
{{- end }}
