suite: longhorn monitoring resources
release:
  name: longhorn
  namespace: longhorn-system
templates:
  - templates/servicemonitor.yaml
tests:
  - it: renders ServiceMonitor and alert rules for storage readiness
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: kind
          value: ServiceMonitor
      - documentIndex: 1
        equal:
          path: kind
          value: PrometheusRule
      - documentIndex: 1
        equal:
          path: spec.groups[0].rules[0].alert
          value: LonghornManagerTargetDown
      - documentIndex: 1
        equal:
          path: spec.groups[0].rules[1].alert
          value: LonghornVolumeFaulted
