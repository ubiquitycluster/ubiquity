suite: test coredns-autoscaler chart
templates:
  - coredns-autoscaler.yaml
tests:
  - it: should render a ServiceAccount
    asserts:
      - isKind:
          of: ServiceAccount
        documentIndex: 0
      - equal:
          path: metadata.name
          value: coredns-autoscaler
        documentIndex: 0

  - it: should render a ClusterRole
    asserts:
      - isKind:
          of: ClusterRole
        documentIndex: 1

  - it: should render a ClusterRoleBinding
    asserts:
      - isKind:
          of: ClusterRoleBinding
        documentIndex: 2

  - it: should render a Deployment
    asserts:
      - isKind:
          of: Deployment
        documentIndex: 3
      - equal:
          path: spec.replicas
          value: 1
        documentIndex: 3
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.k8s.io/cpa/cluster-proportional-autoscaler:1.8.4
        documentIndex: 3

  - it: should use the default namespace
    asserts:
      - equal:
          path: metadata.namespace
          value: kube-system
        documentIndex: 3
