# Default values for coredns-autoscaler
# This is a YAML-formatted file.

namespace: kube-system

image:
  repository: registry.k8s.io/cpa/cluster-proportional-autoscaler
  tag: "1.8.4"
  pullPolicy: IfNotPresent

replicas: 1

autoscaler:
  configMapName: coredns-autoscaler
  targetDeployment: coredns
  defaultParams:
    linear:
      coresPerReplica: 128
      nodesPerReplica: 512
      max: 5
      preventSinglePointFailure: true

resources:
  limits:
    memory: 300Mi
  requests:
    cpu: 20m
    memory: 70Mi

nodeSelector:
  node-role.kubernetes.io/master: "true"

tolerations:
  - key: CriticalAddonsOnly
    operator: Exists

priorityClassName: system-cluster-critical

securityContext:
  seccompProfile:
    type: RuntimeDefault
  supplementalGroups: [65534]
  fsGroup: 65534

syncWave: -3