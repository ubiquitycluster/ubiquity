{{- if and .Values.nicFirmwareStorage.create (not .Values.nicFirmwareStorage.storageClassName) -}}
{{- fail "nicFirmwareStorage.create=true requires nicFirmwareStorage.storageClassName; Ubiquity will not bind NIC firmware storage to an implicit default StorageClass" -}}
{{- end -}}
{{- if and .Values.nicFirmwareStorage.create (not .Values.nicFirmwareStorage.pvcName) -}}
{{- fail "nicFirmwareStorage.create=true requires nicFirmwareStorage.pvcName" -}}
{{- end -}}
{{- if .Values.nicFirmwareStorage.create }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.nicFirmwareStorage.pvcName }}
  namespace: {{ .Release.Namespace }}
spec:
  storageClassName: {{ .Values.nicFirmwareStorage.storageClassName }}
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ default "1Gi" .Values.nicFirmwareStorage.availableStorageSize}}
{{- end }}
