suite: test nvidia nic configuration operator daemon

templates:
  - templates/config-daemon.yaml

tests:
  - it: renders the privileged configuration daemon on selected nodes
    asserts:
      - isKind:
          of: DaemonSet
      - equal:
          path: metadata.name
          value: nic-configuration-daemon
      - equal:
          path: spec.template.spec.hostPID
          value: true
      - equal:
          path: spec.template.spec.hostNetwork
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.privileged
          value: true
      - equal:
          path: spec.template.spec.nodeSelector["network.nvidia.com/operator.mofed.wait"]
          value: "false"
