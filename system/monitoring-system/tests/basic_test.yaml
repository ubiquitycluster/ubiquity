suite: test monitoring-system wrapper rendering

templates:
  - templates/ingress.yaml
  - templates/secret.yaml
  - templates/tls-secret.yaml
  - templates/dgcm-exporter.yaml

tests:
  - it: renders the Grafana ingress wrapper resource
    template: templates/ingress.yaml
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: metadata.name
          value: prom-grafana-ingress

  - it: keeps the legacy DCGM exporter disabled by default
    template: templates/dgcm-exporter.yaml
    asserts:
      - hasDocuments:
          count: 0
