{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kube-bench.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "kube-bench.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  config.yaml: |
    # kube-bench configuration for K3s
    # See: https://github.com/aquasecurity/kube-bench/blob/main/docs/README.md#configuration
    target_mapping:
      kubernetes:
        - targets:
            - master
            - node
          scanners:
            - type: "kube-bench"
              command: "kube-bench"
              args:
                - "--benchmark"
                - "{{ .Values.benchmark }}"
                - "--json"
                - "--outputfile"
                - "/results/scan-result.json"
                - "--skip-id"
                - "4.1.1"
                - "--skip-id"
                - "4.1.2"
                - "--skip-id"
                - "4.1.3"
                - "--skip-id"
