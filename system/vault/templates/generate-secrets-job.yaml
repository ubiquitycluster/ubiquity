apiVersion: batch/v1
kind: CronJob
metadata:
  name: generate-secrets
  namespace: '{{ .Release.Namespace }}'
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  schedule: '{{ .Values.secretGenerator.schedule }}'
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: apply
              image: '{{ .Values.secretGenerator.image.repository }}:{{ .Values.secretGenerator.image.tag }}'
              imagePullPolicy: '{{ .Values.secretGenerator.image.pullPolicy }}'
              env:
                - name: VAULT_ADDR
                  value: '{{ .Values.secretGenerator.vaultAddr }}'
                - name: VAULT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: '{{ .Values.secretGenerator.tokenSecret.name }}'
                      key: '{{ .Values.secretGenerator.tokenSecret.key }}'
              command:
                - /usr/local/bin/generate-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                capabilities:
                  drop:
                    - ALL
