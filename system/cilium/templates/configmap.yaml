{{- if .Values.ciliumConfigMap.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cilium.fullname" . }}-config
  labels:
    {{- include "cilium.labels" . | nindent 4 }}
data:
  cilium-helm-values.yaml: |
    # Generated by Ubiquity — Cilium Helm values for k3s
    # Install with:
    #   helm repo add cilium https://helm.cilium.io
    #   helm install cilium cilium/cilium \
    #     --namespace kube-system \
    #     --values <(echo "$CILIUM_VALUES")
    operator:
      replicas: {{ .Values.cilium.operator.replicas }}
    kubeProxyReplacement: {{ .Values.cilium.kubeProxyReplacement }}
    l2announcements:
      enabled: {{ .Values.l2Announcement.enabled }}
    k8sServiceHost: {{ .Values.cilium.k8sServiceHost }}
    k8sServicePort: {{ .Values.cilium.k8sServicePort }}
    hubble:
      relay:
        enabled: {{ .Values.hubble.relay.enabled }}
      ui:
        enabled: {{ .Values.hubble.ui.enabled }}
  k3s-config-notes.txt: |
    To use Cilium instead of flannel + MetalLB, add these to
    k3s_server_config in metal/group_vars/metal.yml:

    k3s_server_config:
      flannel-backend: none
      disable-kube-proxy: true
      disable-network-policy: true
      secrets-encryption: true
      disable:
        - local-storage
        - servicelb
        - traefik
{{- end }}