nameOverride: hajimari
image:
  repository: ghcr.io/toboshii/hajimari
  tag: v0.2.0
service:
  port: 80
  targetPort: 8080
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/session-cookie-name: route
    nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
    cert-manager.io/cluster-issuer: pebble-issuer
    hajimari.io/enable: "false"
  hosts:
    - host: hajimari.ubiquitycluster.uk
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: hajimari-tls-certificate
      hosts:
        - hajimari.ubiquitycluster.uk
resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    cpu: 100m
    memory: 256Mi
env:
  - name: TZ
    value: Europe/London
hajimari:
  defaultEnable: true
  namespaceSelector:
    any: true
  groups:
    - name: Ubiquity
      links:
        - name: Documentation
          url: https://ubiquitycluster.github.io/ubiquity
        - name: Public GitHub repository
          url: https://github.com/ubiquitycluster/ubiquity
    - name: Managed services
      links:
        - name: Terraform Cloud
          url: https://app.terraform.io
        - name: Cloudflare
          url: https://dash.cloudflare.com