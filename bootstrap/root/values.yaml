gitops:
  repo: https://github.com/ubiquitycluster/ubiquity.git
  revision: main
nico:
  # NICo and NVIDIA NIC Configuration Operator wrappers are installed by the
  # explicit `ubiquity up` lifecycle path. Keep root GitOps from deploying them
  # in every environment unless opted in.
  enabled: false
stacks:
  - name: bootstrap
    namespace: argocd # Override default value
    #  - name: storage
    #  - name: system-upgrades
  - name: system
    excludes:
      # BMO/Metal3 is a fallback/migration-only lifecycle backend. Do not
      # deploy it from the root GitOps ApplicationSet unless explicitly opted in.
      - system/baremetal-operator-system
  - name: monitoring
  - name: platform
  - name: apps
