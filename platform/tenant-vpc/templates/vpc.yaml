apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.tenant.name }}
  labels:
    ubiquity.ai/tenant: {{ .Values.tenant.name }}
    ubiquity.ai/vpc-cidr: {{ .Values.tenant.cidr }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ .Values.tenant.name }}-quota
  namespace: {{ .Values.tenant.name }}
spec:
  hard:
    requests.cpu: {{ .Values.tenant.quota.cpu | quote }}
    requests.memory: {{ .Values.tenant.quota.memory }}
    {{- if .Values.tenant.quota.gpu }}
    nvidia.com/gpu: {{ .Values.tenant.quota.gpu | quote }}
    {{- end }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ .Values.tenant.name }}-vpc
  namespace: {{ .Values.tenant.name }}
  labels:
    ubiquity.ai/tenant: {{ .Values.tenant.name }}
    ubiquity.ai/network-isolation: multus
spec:
  config: '{"cniVersion":"0.3.1","type":"bridge","bridge":"{{ .Values.tenant.bridge }}","ipam":{"type":"host-local","subnet":"{{ .Values.tenant.cidr }}","gateway":"{{ .Values.tenant.gateway }}"}}'
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.tenant.name }}-default-deny
  namespace: {{ .Values.tenant.name }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.tenant.name }}-allow-same-tenant
  namespace: {{ .Values.tenant.name }}
spec:
  podSelector: {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              ubiquity.ai/tenant: {{ .Values.tenant.name }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              ubiquity.ai/tenant: {{ .Values.tenant.name }}
