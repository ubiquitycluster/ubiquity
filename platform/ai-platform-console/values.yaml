---
replicaCount: 1

image:
  repository: ghcr.io/ubiquitycluster/ubiquity
  tag: latest
  pullPolicy: IfNotPresent

profile: ai-production
listenPort: 8080

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  host: ai-platform.example.com
  annotations: {}
  tls: []

podLabels: {}
podAnnotations: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
