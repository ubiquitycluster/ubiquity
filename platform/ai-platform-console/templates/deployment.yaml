---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-platform-console.fullname" . }}
  labels:
    {{- include "ai-platform-console.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ai-platform-console.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "ai-platform-console.labels" . | nindent 8 }}
        ubiquity.ai/profile: {{ .Values.profile | quote }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        ubiquity.ai/readiness-boundary: "intent-only-until-live-gpu-network-serving-validation-evidence"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: console
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - ai-platform
            - --profile
            - {{ .Values.profile | quote }}
            - serve
            - --listen
            - "0.0.0.0:{{ .Values.listenPort }}"
          ports:
            - name: http
              containerPort: {{ .Values.listenPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
