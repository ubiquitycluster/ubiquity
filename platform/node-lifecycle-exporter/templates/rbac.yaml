apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "node-lifecycle-exporter.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "node-lifecycle-exporter.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - services
      - endpoints
      - configmaps
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "node-lifecycle-exporter.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "node-lifecycle-exporter.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "node-lifecycle-exporter.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "node-lifecycle-exporter.fullname" . }}
    namespace: {{ .Release.Namespace }}
