apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "node-lifecycle-exporter.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "node-lifecycle-exporter.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "node-lifecycle-exporter.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "node-lifecycle-exporter.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.service.port }}"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: {{ include "node-lifecycle-exporter.fullname" . }}
      containers:
        - name: exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NICO_BASE_URL
              value: {{ .Values.nico.baseURL | quote }}
            - name: NICO_SITE
              value: {{ .Values.nico.site | quote }}
            {{- if .Values.nico.existingSecretName }}
            - name: UBIQUITY_NICO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nico.existingSecretName | quote }}
                  key: {{ .Values.nico.tokenEnvKey | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.service.port }}
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
          resources:
{{ toYaml .Values.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "node-lifecycle-exporter.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "node-lifecycle-exporter.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  ports:
    - name: metrics
      port: {{ .Values.service.port }}
      targetPort: metrics
  selector:
    app.kubernetes.io/name: {{ include "node-lifecycle-exporter.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "node-lifecycle-exporter.fullname" . }}
