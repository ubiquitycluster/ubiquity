{{- if and .Values.ngc.commitCredentials (not .Values.ngc.existingApiKeySecret) }}
{{- fail "ngc.commitCredentials=true is not supported because credentials must not be committed to Git; create the NGC secrets out-of-band and reference them with existingApiKeySecret/existingPullSecret" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: nim-ngc-secret-policy
  namespace: {{ .Release.Namespace }}
data:
  apiKeySecretName: {{ default .Values.ngc.apiKeySecretName .Values.ngc.existingApiKeySecret | quote }}
  pullSecretName: {{ default .Values.ngc.pullSecretName .Values.ngc.existingPullSecret | quote }}
  commitCredentials: "false"
  policy: "NGC credentials must be supplied as pre-existing Kubernetes secrets or secret-manager output, never committed to Git."
