apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: {{ .Values.policy.name }}
  namespace: {{ .Values.policy.namespace }}
  labels:
    ubiquity.ai/backup-policy: tenant
spec:
  backend:
    repositorySecretRef:
      name: {{ .Values.policy.repositorySecretName }}
      key: password
  backup:
    schedule: {{ .Values.policy.schedule | quote }}
  check:
    schedule: {{ .Values.policy.schedule | quote }}
  prune:
    schedule: {{ .Values.policy.schedule | quote }}
    retention:
      keepDaily: {{ .Values.policy.retentionDays }}
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: {{ .Values.policy.snapshotClass }}
  labels:
    ubiquity.ai/snapshot-policy: retained
  annotations:
    ubiquity.ai/immutability-note: "Retain snapshots and use immutable object storage where configured; rendering is not restore proof."
driver: driver.longhorn.io
deletionPolicy: Retain
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.policy.preset.name }}-resource-preset
  namespace: {{ .Values.policy.namespace }}
  labels:
    ubiquity.ai/resource-preset: {{ .Values.policy.preset.name }}
data:
  cpu: {{ .Values.policy.preset.cpu | quote }}
  memory: {{ .Values.policy.preset.memory }}
  {{- if .Values.policy.preset.gpu }}
  nvidia.com/gpu: {{ .Values.policy.preset.gpu | quote }}
  {{- end }}
{{- if .Values.policy.restoreDrill.enabled }}
{{- /* readiness boundary: restore-object-rendered-not-restore-proof */}}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.policy.restoreDrill.namespace }}
  labels:
    ubiquity.ai/restore-drill: {{ .Values.policy.name }}
---
apiVersion: k8up.io/v1
kind: Restore
metadata:
  name: {{ .Values.policy.name }}-restore-drill
  namespace: {{ .Values.policy.restoreDrill.namespace }}
  labels:
    ubiquity.ai/restore-drill: {{ .Values.policy.name }}
spec:
  snapshot: {{ .Values.policy.restoreDrill.snapshot }}
  restoreMethod: folder
  restoreTarget:
    volume:
      claimName: {{ .Values.policy.name }}-restore-target
  backend:
    repositorySecretRef:
      name: {{ .Values.policy.repositorySecretName }}
      key: password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.policy.name }}-restore-drill-checklist
  namespace: {{ .Values.policy.restoreDrill.namespace }}
  labels:
    ubiquity.ai/restore-drill: {{ .Values.policy.name }}
data:
  readinessBoundary: {{ .Values.policy.restoreDrill.readinessBoundary }}
  requiredEvidence: |
    - Restore status condition reports completion.
    - Restored PVC/data is inspected in the isolated drill namespace.
    - Application smoke test passes against restored data.
    - Drill namespace is deleted after evidence is captured.
{{- end }}
