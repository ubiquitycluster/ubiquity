organizations:
  - name: ops
    description: Operations
    teams:
      - name: Owners
        members:
          - renovate
repositories:
  - name: ubiquity
    owner: ops
    description: Ubiquity platform source mirror for in-cluster GitOps recovery
    private: false
    migrate:
      source: https://github.com/ubiquitycluster/ubiquity
      mirror: false
  - name: blog
    owner: ubiquity
    description: Ubiquity documentation and announcement source mirror
    migrate:
      source: https://github.com/ubiquitycluster/blog
      mirror: true
  - name: backstage
    owner: ubiquity
    description: Ubiquity developer portal source mirror
    migrate:
      source: https://github.com/ubiquitycluster/backstage
      mirror: true
