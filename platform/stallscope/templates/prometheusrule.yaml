{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "stallscope.fullname" . }}
  labels:
{{ include "stallscope.labels" . | indent 4 }}
{{- with .Values.prometheusRule.labels }}
{{ toYaml . | indent 4 }}
{{- end }}
spec:
  groups:
    - name: stallscope.gpu-workloads
      rules:
        - alert: StallscopeGPUWorkloadSlow
          expr: monitoring_profile_label == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Stallscope detected a slow GPU workload
            description: Stallscope classified the GPU workload as SLOW. Check bottleneck, RDMA, PFC, network, and GPU telemetry reasons on the affected node.
        - alert: StallscopeGPUWorkloadFailRisk
          expr: monitoring_profile_label == 2
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Stallscope detected GPU workload fail risk
            description: Stallscope classified the GPU workload as FAIL_RISK. Investigate GPU throttling, RDMA transport errors, PFC congestion, and host pressure immediately.
        - alert: StallscopeTelemetryUnavailable
          expr: monitoring_active_alerts > 0 and absent(monitoring_gpu_utilization_avg)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Stallscope GPU telemetry is unavailable
            description: Stallscope is running but cannot collect GPU metrics. Verify NVIDIA runtime, nvidia-smi, GPU Operator, and device visibility on the node.
{{- end }}
